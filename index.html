<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça ao Tesouro</title>
    <style>
        /* Variáveis de Cores para Modo Claro e Escuro */
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --btn-bg: #ff9f43;
        }
        [data-theme="dark"] {
            --bg-color: #1e1e24;
            --text-color: #f4f4f9;
            --card-bg: #2a2a32;
            --btn-bg: #ee5253;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: 0.3s;
        }

        .menu {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            align-items: center;
            margin-bottom: 15px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        /* Container do Mapa */
        .map-box {
            position: relative;
            display: inline-block;
            margin-top: 15px;
            border: 5px solid #8b5a2b;
            border-radius: 8px;
            background-color: #ddd;
        }

        .map-box img {
            display: block;
            width: 100%;
            max-width: 450px;
            height: auto;
        }

        /* Botão Oculto do Tesouro (Fica exatamente em cima da bússola/rosa dos ventos) */
        .treasure-btn {
            position: absolute;
            top: 28%;    /* Ajusta a posição vertical */
            left: 20%;   /* Ajusta a posição horizontal */
            width: 55px;  /* Área clicável */
            height: 55px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
        }

        /* Estilo dos Botões do Sistema */
        .btn {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            background-color: var(--btn-bg);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { opacity: 0.9; }

        #resetBtn {
            margin-top: 15px;
            display: none;
            background-color: #10ac84;
        }

        #status {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="menu">
        <h2>Caça ao Tesouro 🏴‍☠️</h2>
        <button class="btn" id="themeBtn">Modo Escuro</button>
    </div>

    <div class="container">
        <p id="status">Dica: O tesouro está escondido perto do instrumento de navegação marítima!</p>
        
        <div class="map-box">
            <!-- Imagem real de um mapa antigo hospedada na Wikimedia/Pixabay -->
            <img src="https://wikimedia.org" alt="Mapa do Tesouro">
            
            <!-- Botão invisível do alvo funcional -->
            <button class="treasure-btn" id="treasureTarget"></button>
        </div>

        <br>
        <button class="btn" id="resetBtn">Jogar Novamente</button>
    </div>

    <script>
        const themeBtn = document.getElementById('themeBtn');
        const treasureTarget = document.getElementById('treasureTarget');
        const status = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');

        // Código Funcional 1: Alternador de Modo Claro e Escuro
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeBtn.textContent = 'Modo Escuro';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.textContent = 'Modo Claro';
            }
        });

        // Código Funcional 2: Clique para Achar o Tesouro
        treasureTarget.addEventListener('click', () => {
            status.textContent = '🎉 Incrível! Você clicou na bússola antiga e encontrou o Baú de Ouro! 💰👑';
            status.style.color = '#10ac84';
            resetBtn.style.display = 'inline-block'; // Mostra botão de reiniciar
        });

        // Código Funcional 3: Botão de Reiniciar
        resetBtn.addEventListener('click', () => {
            status.textContent = 'Dica: O tesouro está escondido perto do instrumento de navegação marítima!';
            status.style.color = '';
            resetBtn.style.display = 'none';
        });
    </script>
</body>
</html>
