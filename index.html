<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça ao Tesouro</title>
    <style>
        /* Variáveis de Cores para os Temas */
        :root { --bg: #f0f2f5; --text: #333; --card: #fff; --btn: #007bff; }
        [data-theme="dark"] { --bg: #18191a; --text: #e4e6eb; --card: #242526; --btn: #2f80ed; }

        body {
            font-family: sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: 0.3s;
        }
        .container {
            background-color: var(--card);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .map-container {
            position: relative;
            display: inline-block;
            border: 4px solid #8b5a2b;
            border-radius: 8px;
        }
        .map-container img {
            display: block;
            max-width: 100%;
            height: 350px; /* Tamanho fixo para facilitar o clique */
        }
        /* Botão do Tesouro (Invisível) */
        .treasure-target {
            position: absolute;
            top: 40%; /* Posição vertical */
            left: 55%; /* Posição horizontal */
            width: 60px;
            height: 60px;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .btn-game {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: var(--btn);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #resetBtn { display: none; }
    </style>
</head>
<body>

    <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 10px;">
        <h1>Caça ao Tesouro 🏴‍☠️</h1>
        <button class="btn-game" id="themeBtn">Modo Escuro</button>
    </div>

    <div class="container">
        <p id="status">Clique no mapa para achar o baú escondido!</p>
        
        <div class="map-container">
            <!-- Imagem real de um mapa do tesouro antiga -->
            <img src="https://unsplash.com" alt="Mapa">
            
            <!-- Alvo invisível do clique -->
            <button class="treasure-target" id="treasure"></button>
        </div>
        <br>
        <button class="btn-game" id="resetBtn">Jogar Novamente</button>
    </div>

    <script>
        const themeBtn = document.getElementById('themeBtn');
        const treasure = document.getElementById('treasure');
        const status = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');

        // Alternar Modo Claro e Escuro
        themeBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            themeBtn.textContent = isDark ? 'Modo Escuro' : 'Modo Claro';
        });

        // Evento de achar o tesouro
        treasure.addEventListener('click', () => {
            status.textContent = '🎉 Sensacional! Você encontrou o baú de ouro! 💰';
            status.style.color = '#27ae60';
            resetBtn.style.display = 'inline-block';
        });

        // Evento de reiniciar
        resetBtn.addEventListener('click', () => {
            status.textContent = 'Clique no mapa para achar o baú escondido!';
            status.style.color = '';
            resetBtn.style.display = 'none';
        });
    </script>
</body>
</html>
