<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Reciclagem</title>
    <style>
        /* Cores do Tema Claro (Padrão) */
        :root {
            --bg-color: #e8f5e9;
            --text-color: #1b5e20;
            --card-bg: #ffffff;
            --btn-theme: #2e7d32;
            --btn-action: #d32f2f;
        }

        /* Cores do Tema Escuro */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --btn-theme: #4caf50;
            --btn-action: #f44336;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            align-items: center;
            margin-bottom: 15px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Moldura da Imagem */
        .image-box {
            position: relative;
            display: inline-block;
            margin-top: 15px;
            border: 4px solid var(--btn-theme);
            border-radius: 12px;
            overflow: hidden;
            background-color: #eaeaea;
        }

        .image-box img {
            display: block;
            width: 100%;
            max-width: 450px;
            height: auto;
        }

        /* Alvo de clique oculto na caçamba traseira do caminhão laranja/cinza */
        .click-target {
            position: absolute;
            top: 25%;    
            left: 10%;   
            width: 35%; 
            height: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
        }

        /* Estilo Geral dos Botões Visíveis */
        .btn {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.95); }
        
        #themeBtn { background-color: var(--btn-theme); }
        #actionBtn { background-color: var(--btn-action); margin-top: 20px; width: 100%; }

        #score-board {
            font-size: 24px;
            margin: 15px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h2>Eco Reciclagem ♻️</h2>
        <!-- BOTÃO 1: Alternar entre claro e escuro -->
        <button class="btn" id="themeBtn">Modo Escuro</button>
    </header>

    <div class="container">
        <p id="instruction">Toque na <strong>caçamba traseira</strong> do caminhão de coleta para carregar os recicláveis!</p>
        
        <div id="score-board">Coletado: <span id="score">0</span> kg</div>

        <div class="image-box">
            <!-- Imagem estável e de alta compatibilidade da Wikimedia Commons -->
            <img src="https://wikimedia.org" alt="Caminhão de Reciclagem">
            <!-- Botão invisível em cima da traseira do caminhão -->
            <button class="click-target" id="truckTarget"></button>
        </div>

        <!-- BOTÃO 2: Ação de esvaziar a caçamba e zerar os pontos -->
        <button class="btn" id="actionBtn">Descarregar na Usina</button>
    </div>

    <script>
        const themeBtn = document.getElementById('themeBtn');
        const truckTarget = document.getElementById('truckTarget');
        const actionBtn = document.getElementById('actionBtn');
        const scoreDisplay = document.getElementById('score');
        const instruction = document.getElementById('instruction');
        
        let totalKg = 0;

        // Lógica do BOTÃO 1: Modo Claro e Escuro
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeBtn.textContent = 'Modo Escuro';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.textContent = 'Modo Claro';
            }
        });

        // Lógica do Clique Oculto: Coleta materiais ao clicar na caçamba
        truckTarget.addEventListener('click', () => {
            totalKg += 10; // Soma 10kg por clique
            scoreDisplay.textContent = totalKg;
            instruction.innerHTML = '🌱 Ótimo trabalho! O caminhão está acumulando materiais.';
        });

        // Lógica do BOTÃO 2: Reseta o placar simulando a entrega na usina
        actionBtn.addEventListener('click', () => {
            if (totalKg === 0) {
                instruction.innerHTML = '❌ O caminhão já está vazio! Clique primeiro na caçamba.';
                return;
            }
            totalKg = 0;
            scoreDisplay.textContent = totalKg;
            instruction.innerHTML = '🚛 Materiais entregues! A cidade agradece. Pronto para nova coleta.';
        });
    </script>
</body>
</html>
