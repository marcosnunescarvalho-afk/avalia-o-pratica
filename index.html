<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Reciclagem</title>
    <style>
        /* Cores do Tema Claro (Padrão) */
        :root {
            --bg: #e8f5e9;
            --text: #1b5e20;
            --card: #ffffff;
            --btn-theme: #2e7d32;
            --btn-action: #d32f2f;
        }
        /* Cores do Tema Escuro */
        [data-theme="dark"] {
            --bg: #121212;
            --text: #e0e0e0;
            --card: #1e1e1e;
            --btn-theme: #4caf50;
            --btn-action: #f44336;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            align-items: center;
            margin-bottom: 15px;
        }

        .container {
            background-color: var(--card);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        /* Área do Caminhão */
        .truck-box {
            position: relative;
            display: inline-block;
            margin-top: 15px;
            border: 4px solid var(--btn-theme);
            border-radius: 12px;
            overflow: hidden;
        }

        .truck-box img {
            display: block;
            width: 100%;
            max-width: 450px;
            height: auto;
        }

        /* Alvo invisível do clique na caçamba traseira */
        .recycle-target {
            position: absolute;
            top: 25%;    
            left: 65%;   
            width: 110px; 
            height: 120px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
        }

        /* Estilo dos Botões Principais */
        .btn {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        
        #themeBtn { background-color: var(--btn-theme); }
        #actionBtn { background-color: var(--btn-action); margin-top: 15px; }

        #score-board {
            font-size: 22px;
            margin: 15px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Reciclagem Ativa ♻️</h2>
        <!-- BOTÃO 1: Alternador de Tema -->
        <button class="btn" id="themeBtn">Modo Escuro</button>
    </div>

    <div class="container">
        <p id="instruction">Toque na <strong>caçamba traseira</strong> do caminhão para colocar o material reciclável!</p>
        
        <div id="score-board">Lixo Reciclado: <span id="score">0</span> kg</div>

        <div class="truck-box">
            <!-- Imagem real de um caminhão verde de lixo -->
            <img src="https://unsplash.com" alt="Caminhão de Lixo Verde">
            <button class="recycle-target" id="truckTarget"></button>
        </div>

        <br>
        <!-- BOTÃO 2: Ação funcional de esvaziar/reiniciar -->
        <button class="btn" id="actionBtn">Esvaziar Caçamba</button>
    </div>

    <script>
        const themeBtn = document.getElementById('themeBtn');
        const truckTarget = document.getElementById('truckTarget');
        const actionBtn = document.getElementById('actionBtn');
        const scoreDisplay = document.getElementById('score');
        const instruction = document.getElementById('instruction');
        
        let count = 0;

        // Funcionamento do BOTÃO 1: Modo Claro e Escuro
        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeBtn.textContent = 'Modo Escuro';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeBtn.textContent = 'Modo Claro';
            }
        });

        // Funcionamento do Clique na Imagem: Adiciona lixo
        truckTarget.addEventListener('click', () => {
            count += 5; // Adiciona de 5 em 5 quilos
            scoreDisplay.textContent = count;
            instruction.innerHTML = '🚚 Coleta realizada com sucesso! Continue enchendo o caminhão.';
        });

        // Funcionamento do BOTÃO 2: Esvaziar e zerar o jogo
        actionBtn.addEventListener('click', () => {
            count = 0;
            scoreDisplay.textContent = count;
            instruction.innerHTML = '♻️ O caminhão foi esvaziado na usina de reciclagem. Pronto para começar de novo!';
        });
    </script>
</body>
</html>
